openapi: 3.1.0
info:
  title: Pleos Stay+ API
  version: 0.3.0-draft
  description: 'Parking v0.2 unchanged; Pickup v0.3 independent sessions aligned to the 2026-11-03 Notion specification. Waiting REST paths are historical draft only; implemented Waiting remains Android Room LOCAL. Driver Android/emulator silently uses a separate Supabase Anonymous Auth JWT, and Pleos platform login is not assumed to authenticate this API.'
servers:
  - url: https://example.invalid/api/v1
    description: Placeholder; deployment not chosen
security:
  - bearerAuth: []
tags:
  - name: Parking
  - name: Waiting
  - name: Pickup
paths:
  /health:
    get:
      summary: Parking API health check
      security: []
      responses:
        '200':
          description: Server process is ready; provider availability is checked on parking requests
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
  /parking/places:
    get:
      tags: [Parking]
      summary: Search parking and verified short-stop places
      security: []
      parameters:
        - {name: lat, in: query, required: true, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: lng, in: query, required: true, schema: {type: number, minimum: -180, maximum: 180}}
        - {name: radiusMeters, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 10000, default: 2000}}
        - {name: plannedMinutes, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 1440, default: 10}}
        - {name: purpose, in: query, required: false, schema: {$ref: '#/components/schemas/ParkingPurpose'}}
        - {name: freeOnly, in: query, required: false, schema: {type: boolean, default: false}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: Filtered results; no legal or physical safety guarantee
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ParkingSearchResult'}
        '400': {$ref: '#/components/responses/ParkingFailure'}
        '429': {$ref: '#/components/responses/ParkingFailure'}
        '502': {$ref: '#/components/responses/ParkingFailure'}
        '503': {$ref: '#/components/responses/ParkingFailure'}
  /parking/places/{placeId}:
    get:
      tags: [Parking]
      security: []
      summary: Parking/waiting spot detail
      parameters: [{$ref: '#/components/parameters/placeId'}]
      responses:
        '200': {description: Place detail, content: {application/json: {schema: {$ref: '#/components/schemas/ParkingPlace'}}}}
        '404': {$ref: '#/components/responses/ParkingFailure'}
        '502': {$ref: '#/components/responses/ParkingFailure'}
        '503': {$ref: '#/components/responses/ParkingFailure'}
  /parking/places/{placeId}/estimate:
    get:
      tags: [Parking]
      security: []
      summary: Fee estimate, UNKNOWN when pricing terms are inadequate
      parameters:
        - {$ref: '#/components/parameters/placeId'}
        - {name: plannedMinutes, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 1440}}
      responses:
        '200': {description: Estimate, content: {application/json: {schema: {$ref: '#/components/schemas/ParkingEstimate'}}}}
        '400': {$ref: '#/components/responses/ParkingFailure'}
        '404': {$ref: '#/components/responses/ParkingFailure'}
        '502': {$ref: '#/components/responses/ParkingFailure'}
        '503': {$ref: '#/components/responses/ParkingFailure'}
  /waiting-sessions:
    post:
      tags: [Waiting]
      summary: Start a waiting session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plannedMinutes]
              properties:
                parkingPlaceId: {type: [string, 'null']}
                plannedMinutes: {type: integer, minimum: 1}
                mode: {$ref: '#/components/schemas/StayMode'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/WaitingSession'}}}}
        '409': {$ref: '#/components/responses/ApiFailure'}
  /waiting-sessions/{sessionId}:
    parameters: [{$ref: '#/components/parameters/sessionId'}]
    get:
      tags: [Waiting]
      summary: Retrieve waiting session
      responses:
        '200': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/WaitingSession'}}}}
        '404': {$ref: '#/components/responses/ApiFailure'}
    patch:
      tags: [Waiting]
      summary: Update duration or active mode with optimistic revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision: {type: integer, minimum: 0}
                plannedMinutes: {type: integer, minimum: 1}
                mode: {$ref: '#/components/schemas/StayMode'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/WaitingSession'}}}}
        '409': {$ref: '#/components/responses/ApiFailure'}
  /waiting-sessions/{sessionId}/end:
    post:
      tags: [Waiting]
      summary: End session and invalidate invitations
      parameters: [{$ref: '#/components/parameters/sessionId'}]
      responses:
        '200': {description: Ended, content: {application/json: {schema: {$ref: '#/components/schemas/WaitingSession'}}}}
        '404': {$ref: '#/components/responses/ApiFailure'}
  /pickup/sessions:
    post:
      tags: [Pickup]
      summary: Create an independent Pickup session
      description: Driver Android/emulator silently establishes a separate Supabase Anonymous Auth session. The server derives owner identity only from the verified JWT; Pleos login and request-body owner IDs are never trusted. Waiting linkage is optional and does not create a server Waiting session.
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationSharingConsent]
              properties:
                waitingSessionId: {type: [string, 'null'], description: Optional local Waiting UUID; Pickup does not depend on a server Waiting session}
                locationSharingConsent: {type: boolean, const: true}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/PickupSession'}}}}
        '400': {$ref: '#/components/responses/ApiFailure'}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
  /pickup/sessions/{sessionId}:
    get:
      tags: [Pickup]
      summary: Retrieve an owned Pickup session
      parameters: [{$ref: '#/components/parameters/sessionId'}]
      responses:
        '200': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/PickupSession'}}}}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '404': {$ref: '#/components/responses/ApiFailure'}
  /pickup/sessions/{sessionId}/invitations:
    post:
      tags: [Pickup]
      summary: Issue or reissue the single-participant invitation for 60 minutes
      parameters:
        - {$ref: '#/components/parameters/sessionId'}
        - {$ref: '#/components/parameters/idempotencyKey'}
      responses:
        '201': {description: Invitation token is returned only in the share URL, content: {application/json: {schema: {$ref: '#/components/schemas/PickupInvitationIssued'}}}}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '404': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
  /pickup/invitations/redeem:
    post:
      tags: [Pickup]
      summary: Redeem an invitation with a guest anonymous-auth JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, consent]
              properties:
                token: {type: string, minLength: 1}
                consent: {type: boolean}
                displayName: {type: string, maxLength: 60}
      responses:
        '200':
          description: Participant scope is bound to the authenticated guest UID
          content:
            application/json:
              schema:
                type: object
                required: [participantId, sessionId, status, revision]
                properties:
                  participantId: {type: string, format: uuid}
                  sessionId: {type: string, format: uuid}
                  status: {$ref: '#/components/schemas/PickupParticipantStatus'}
                  revision: {type: integer, minimum: 1}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
        '410': {$ref: '#/components/responses/ApiFailure'}
  /pickup/participants/{participantId}/status:
    post:
      tags: [Pickup]
      summary: Participant changes pickup status
      parameters: [{$ref: '#/components/parameters/participantId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, clientEventId]
              properties:
                status: {$ref: '#/components/schemas/PickupParticipantStatus'}
                clientEventId: {type: string, format: uuid}
      responses:
        '200':
          description: Accepted state
          content:
            application/json:
              schema:
                type: object
                required: [accepted, status, revision]
                properties:
                  accepted: {type: boolean}
                  status: {$ref: '#/components/schemas/PickupParticipantStatus'}
                  revision: {type: integer, minimum: 1}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '404': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
  /pickup/sessions/{sessionId}/vehicle-location:
    put:
      tags: [Pickup]
      summary: Replace the latest consented vehicle location
      parameters: [{$ref: '#/components/parameters/sessionId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PickupLocationUpdate'}}}}
      responses:
        '200': {description: Snapshot revision, content: {application/json: {schema: {$ref: '#/components/schemas/PickupRevision'}}}}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '404': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
  /pickup/participants/{participantId}/location:
    put:
      tags: [Pickup]
      summary: Replace the latest optional participant location
      parameters: [{$ref: '#/components/parameters/participantId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PickupLocationUpdate'}}}}
      responses:
        '200': {description: Snapshot revision, content: {application/json: {schema: {$ref: '#/components/schemas/PickupRevision'}}}}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '404': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
  /pickup/sessions/{sessionId}/snapshot:
    get:
      tags: [Pickup]
      summary: Retrieve the authorized current snapshot after reconnect
      parameters: [{$ref: '#/components/parameters/sessionId'}]
      responses:
        '200': {description: Authorized snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/PickupSnapshot'}}}}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '404': {$ref: '#/components/responses/ApiFailure'}
        '410': {$ref: '#/components/responses/ApiFailure'}
  /pickup/sessions/{sessionId}/complete:
    post:
      tags: [Pickup]
      summary: Confirm manual pickup completion as driver or participant
      parameters: [{$ref: '#/components/parameters/sessionId'}, {$ref: '#/components/parameters/idempotencyKey'}]
      responses:
        '200': {description: Completed and current locations removed, content: {application/json: {schema: {$ref: '#/components/schemas/PickupSession'}}}}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '404': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
  /pickup/sessions/{sessionId}/cancel:
    post:
      tags: [Pickup]
      summary: Cancel Pickup as driver or participant
      parameters: [{$ref: '#/components/parameters/sessionId'}, {$ref: '#/components/parameters/idempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: {reason: {type: string, minLength: 1, maxLength: 120}}
      responses:
        '200': {description: Cancelled and current locations removed, content: {application/json: {schema: {$ref: '#/components/schemas/PickupSession'}}}}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '404': {$ref: '#/components/responses/ApiFailure'}
        '409': {$ref: '#/components/responses/ApiFailure'}
  /pickup/sessions/{sessionId}/end:
    post:
      tags: [Pickup]
      summary: End Pickup from the driver, including an optional local Waiting-end propagation
      parameters: [{$ref: '#/components/parameters/sessionId'}, {$ref: '#/components/parameters/idempotencyKey'}]
      responses:
        '200': {description: Ended and current locations removed, content: {application/json: {schema: {$ref: '#/components/schemas/PickupSession'}}}}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '404': {$ref: '#/components/responses/ApiFailure'}
  /pickup/sessions/{sessionId}/revoke-invitation:
    post:
      tags: [Pickup]
      summary: Revoke the current invitation and participant access
      parameters: [{$ref: '#/components/parameters/sessionId'}, {$ref: '#/components/parameters/idempotencyKey'}]
      responses:
        '204': {description: Revoked}
        '401': {$ref: '#/components/responses/ApiFailure'}
        '404': {$ref: '#/components/responses/ApiFailure'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    placeId: {name: placeId, in: path, required: true, schema: {type: string}}
    sessionId: {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
    participantId: {name: participantId, in: path, required: true, schema: {type: string, format: uuid}}
    idempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
  responses:
    ParkingFailure:
      description: Parking-specific error with requestId
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ParkingError'}
    ApiFailure:
      description: Standard error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    StayMode: {type: string, enum: [NONE, WORK, STUDY, ENTERTAINMENT, REST]}
    PickupSessionStatus: {type: string, enum: [ACTIVE, COMPLETED, CANCELLED, ENDED, EXPIRED]}
    PickupParticipantStatus: {type: string, enum: [JOINED, DEPARTED, NEARBY, ARRIVED, CANCELLED]}
    PickupLocationSource: {type: string, enum: [REAL, SIMULATED], description: SIMULATED is reserved for a separately authenticated QA API and is rejected by normal Pickup location endpoints}
    ParkingPurpose: {type: string, enum: [PICKUP, SHORT_WAIT, LONG_STAY], default: SHORT_WAIT}
    ParkingType: {type: string, enum: [PARKING_LOT, ON_STREET_PARKING, PICKUP_ZONE, TIME_LIMITED_ZONE, PUBLIC_REST_AREA]}
    ParkingEligibility: {type: string, enum: [VERIFIED, CONDITIONAL, UNKNOWN]}
    ParkingOperatingStatus: {type: string, enum: [OPEN, CLOSED, UNKNOWN]}
    ParkingSearchResult:
      type: object
      required: [places, total, dataFreshness]
      properties:
        places: {type: array, items: {$ref: '#/components/schemas/ParkingPlace'}}
        total: {type: integer, minimum: 0}
        dataFreshness: {type: string, enum: [FRESH, STALE, UNKNOWN]}
    ParkingPlace:
      type: object
      required: [id, name, type, latitude, longitude, address, distanceMeters, allowedUse, eligibility, eligibilityReason, openingHoursText, operatingStatus, estimatedFee, feeEstimateStatus, feePolicy, parkingCategory, parkingStructure, capacity, restrictions, operatorName, phoneNumber, source, sourceUpdatedAt, liveAvailability]
      properties:
        id: {type: string}
        name: {type: string}
        type: {$ref: '#/components/schemas/ParkingType'}
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        address: {type: [string, 'null']}
        distanceMeters: {type: [number, 'null'], minimum: 0, description: Haversine straight-line distance, not driving route}
        allowedUse: {type: array, items: {type: string, enum: [PARK, STOP, PICKUP]}}
        eligibility: {$ref: '#/components/schemas/ParkingEligibility'}
        eligibilityReason: {type: [string, 'null']}
        openingHoursText: {type: [string, 'null']}
        operatingStatus: {$ref: '#/components/schemas/ParkingOperatingStatus'}
        estimatedFee: {type: [integer, 'null'], minimum: 0}
        feeEstimateStatus: {type: string, enum: [ESTIMATED, FREE, UNKNOWN]}
        feePolicy: {$ref: '#/components/schemas/ParkingFeePolicy'}
        parkingCategory: {type: [string, 'null'], description: Source value such as public or private}
        parkingStructure: {type: [string, 'null'], description: Source value such as on-street, off-street, or attached}
        capacity: {type: [integer, 'null'], minimum: 0}
        restrictions: {type: [string, 'null']}
        operatorName: {type: [string, 'null']}
        phoneNumber: {type: [string, 'null']}
        source: {type: string, enum: [PUBLIC_PARKING_STANDARD, PUBLIC_REST_AREA_STANDARD]}
        sourceUpdatedAt: {type: [string, 'null'], format: date-time}
        liveAvailability: {type: string, enum: [UNKNOWN]}
    ParkingFeePolicy:
      type: object
      required: [kind, basicMinutes, basicFeeKrw, additionalUnitMinutes, additionalUnitFeeKrw, dailyPassMinutes, dailyPassFeeKrw, rawText, uncertaintyReason]
      properties:
        kind: {type: string, enum: [FREE, LINEAR, UNKNOWN]}
        basicMinutes: {type: [integer, 'null'], minimum: 0}
        basicFeeKrw: {type: [integer, 'null'], minimum: 0}
        additionalUnitMinutes: {type: [integer, 'null'], minimum: 0}
        additionalUnitFeeKrw: {type: [integer, 'null'], minimum: 0}
        dailyPassMinutes: {type: [integer, 'null'], minimum: 0}
        dailyPassFeeKrw: {type: [integer, 'null'], minimum: 0}
        rawText: {type: [string, 'null']}
        uncertaintyReason: {type: [string, 'null']}
    ParkingEstimate:
      type: object
      required: [placeId, plannedMinutes, estimatedFeeKrw, status, reason]
      properties:
        placeId: {type: string}
        plannedMinutes: {type: integer, minimum: 1, maximum: 1440}
        estimatedFeeKrw: {type: [integer, 'null'], minimum: 0}
        status: {type: string, enum: [ESTIMATED, FREE, UNKNOWN]}
        reason: {type: [string, 'null']}
    ParkingError:
      type: object
      required: [code, message, requestId]
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string}
    WaitingSession:
      type: object
      required: [id, status, activeMode, startedAt, plannedEndAt, revision]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [ACTIVE, ENDING, ENDED, EXPIRED]}
        activeMode: {$ref: '#/components/schemas/StayMode'}
        startedAt: {type: string, format: date-time}
        plannedEndAt: {type: string, format: date-time}
        endedAt: {type: [string, 'null'], format: date-time}
        revision: {type: integer, minimum: 0}
    PickupSession:
      type: object
      required: [id, waitingSessionId, status, locationSharingConsent, participant, invitationExpiresAt, revision, createdAt, endedAt]
      properties:
        id: {type: string, format: uuid}
        waitingSessionId: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/PickupSessionStatus'}
        locationSharingConsent: {type: boolean}
        participant: {anyOf: [{$ref: '#/components/schemas/PickupParticipant'}, {type: 'null'}]}
        invitationExpiresAt: {type: [string, 'null'], format: date-time}
        revision: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        endedAt: {type: [string, 'null'], format: date-time}
    PickupParticipant:
      type: object
      required: [id, displayName, status, updatedAt]
      properties:
        id: {type: string, format: uuid}
        displayName: {type: string, minLength: 1, maxLength: 60}
        status: {$ref: '#/components/schemas/PickupParticipantStatus'}
        updatedAt: {type: string, format: date-time}
    PickupInvitationIssued:
      type: object
      required: [invitationId, shareUrl, expiresAt]
      properties:
        invitationId: {type: string, format: uuid}
        shareUrl: {type: string, format: uri, description: Contains the one-time invitation secret and must not be logged}
        expiresAt: {type: string, format: date-time}
    PickupLocationUpdate:
      type: object
      required: [latitude, longitude, observedAt, source]
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        accuracyMeters: {type: [number, 'null'], exclusiveMinimum: 0, description: Optional because Pleos FusedLocation 1.1.3 does not expose meter accuracy; never infer it}
        confidence: {type: [number, 'null'], description: Provider-specific confidence when exposed; not interchangeable with meter accuracy}
        observedAt: {type: string, format: date-time}
        source: {$ref: '#/components/schemas/PickupLocationSource'}
    PickupLocation:
      allOf:
        - {$ref: '#/components/schemas/PickupLocationUpdate'}
        - type: object
          required: [receivedAt]
          properties: {receivedAt: {type: string, format: date-time}}
    PickupRevision:
      type: object
      required: [revision, proximityCandidate]
      properties:
        revision: {type: integer, minimum: 1}
        proximityCandidate: {type: boolean, description: Never confirms pickup completion automatically}
    PickupSnapshot:
      type: object
      required: [session, vehicleLocation, participantLocation, proximityCandidate, revision, occurredAt]
      properties:
        session: {$ref: '#/components/schemas/PickupSession'}
        vehicleLocation: {anyOf: [{$ref: '#/components/schemas/PickupLocation'}, {type: 'null'}]}
        participantLocation: {anyOf: [{$ref: '#/components/schemas/PickupLocation'}, {type: 'null'}]}
        proximityCandidate: {type: boolean}
        revision: {type: integer, minimum: 1}
        occurredAt: {type: string, format: date-time}
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: {type: string}
            message: {type: string}
            requestId: {type: string}
